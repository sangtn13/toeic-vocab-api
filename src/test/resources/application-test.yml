spring:
  datasource:
    url: jdbc:h2:mem:toeic_vocab_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_batch_fetch_size: 50
    show-sql: false
    open-in-view: false
  flyway:
    enabled: false
  autoconfigure:
