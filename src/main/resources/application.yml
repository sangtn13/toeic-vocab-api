spring:
  application:
    name: toeic-vocab-api
  datasource:
    url: "${DB_URL}"
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: "${JPA_SHOW_SQL}"
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50
        format_sql: true
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
    open-in-view: false
  jackson:
    time-zone: Asia/Ho_Chi_Minh
  flyway:
    locations: classpath:db/migration
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

server:
  port: "${SERVER_PORT}"

api:
  prefix: /api/v1

toeic:
  app:
    jwtSecret: "${JWT_SECRET}"
    jwtExpirationMs: "${JWT_EXPIRATION_MS}"
    guestProgressExpirationMs: "${GUEST_PROGRESS_EXPIRATION_MS}"

app:
  auth:
    seed-admin-email: "${ADMIN_EMAIL}"
    seed-admin-password: "${ADMIN_PASSWORD}"
    seed-admin-name: "${ADMIN_NAME}"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
